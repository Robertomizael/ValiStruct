name: ValiStruct Fase6 Refresh Secure Lockfile

on:
  push:
    branches:
      - fix/v5-4-fase6-auditoria-independiente
    paths:
      - ".github/workflows/fase6-generate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5-4-fase6-auditoria-independiente
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts
      - name: Full npm audit
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          git config user.name "ValiStruct CI"
          git config user.email "actions@users.noreply.github.com"
          git add desktop/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(fase6): refresh lockfile after electron-builder security update"
          git push origin HEAD:fix/v5-4-fase6-auditoria-independiente
