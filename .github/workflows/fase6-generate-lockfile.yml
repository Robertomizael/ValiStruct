name: ValiStruct Fase6 Refresh Desktop Lockfile

on:
  push:
    branches:
      - fix/v5-4-fase6-auditoria-independiente
    paths:
      - ".github/workflows/fase6-generate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5-4-fase6-auditoria-independiente
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh npm lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify secure production dependency resolution
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        run: |
          git config user.name "ValiStruct CI"
          git config user.email "actions@users.noreply.github.com"
          git add desktop/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(fase6): refresh npm lockfile after security updates"
          git push origin HEAD:fix/v5-4-fase6-auditoria-independiente
