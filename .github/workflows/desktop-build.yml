name: ValiStruct Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - desktop-beta
    paths:
      - "desktop/**"
      - "backend/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "icons/**"
      - ".github/workflows/desktop-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: valistruct-desktop-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Build unpacked macOS app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack:mac
      - name: Ad-hoc sign macOS app for internal testing
        shell: bash
        run: |
          APP_PATH="$(find dist -maxdepth 2 -type d -name 'ValiStruct.app' | head -n 1)"
          test -n "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
      - name: Build macOS DMG from signed app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --prepackaged "$APP_PATH"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: valistruct-desktop-macos
          path: desktop/dist/*.dmg
          if-no-files-found: error
