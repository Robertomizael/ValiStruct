name: ValiStruct Desktop Autonomous Build
# Fase 6 final audited rebuild trigger

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/v5-1-fase1-diseno-datamanager
      - feature/v5-2-ux-validacion-externa
      - fix/v5-2-afe-estadistica-exportaciones
      - hotfix/v5-2-mahalanobis-mardia
      - hotfix/v5-2-motorpro-recovery
      - hotfix/v5-2-4-motorpro-numerics-contextmenu
      - feature/v5-3-simplificacion
      - feature/v5-4-fase2d-privacidad-importacion
      - feature/v5-4-fase3-hardening
      - feature/v5-4-fase4-release-readiness
      - fix/v5-4-fase6-auditoria-independiente
    paths:
      - "desktop/**"
      - "navigation-v51.js"
      - "participant-data.js"
      - "v52-shell.js"
      - "v52.css"
      - "efa-v52.css"
      - "efa-v52.js"
      - "backend/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "version.json"
      - "release/runtime-v5.4-beta1.json"
      - "icons/**"
      - ".github/workflows/desktop-build.yml"

concurrency:
  group: valistruct-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
      - name: Verify v5.1 desktop frontend assets
        shell: pwsh
        run: |
          if (Test-Path v52-shell.js) {
            if (!(Test-Path v52.css)) { throw 'Missing v52.css' }
            if (Test-Path efa-v52.js) { if (!(Test-Path efa-v52.css)) { throw 'Missing efa-v52.css' } }
          }
          if (Test-Path navigation-v51.js) {
            if (!(Test-Path participant-data.js)) { throw 'Missing participant-data.js' }
            if (-not (Select-String -Path desktop/main.js -Pattern 'skipping legacy desktop shell' -Quiet)) { throw 'v5.1 desktop shell compatibility missing' }
          }
      - name: Build integrated Windows runtime
        shell: pwsh
        run: ./desktop/scripts/build_runtime_windows.ps1
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Audit full npm dependency graph
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Build unpacked Windows app
        working-directory: desktop
        run: npm run pack:win
      - name: Smoke packaged Windows app
        shell: pwsh
        working-directory: desktop
        env:
          VALISTRUCT_SMOKE_TEST: "1"
        run: |
          $exe = Resolve-Path "dist/win-unpacked/ValiStruct.exe"
          $app = Start-Process -FilePath $exe -PassThru
          $ok = $false
          try {
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/health -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "Packaged Windows app did not start its backend." }
          } finally {
            if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'backend[\\/]api.py' } | ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win
      - name: Upload Windows autonomous installer
        uses: actions/upload-artifact@v4
        with:
          name: valistruct-desktop-windows-autonomous
          path: desktop/dist/*.exe
          if-no-files-found: error
          compression-level: 0

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            artifact: valistruct-desktop-macos-arm64-autonomous
            architecture: arm64
          - runner: macos-15-intel
            artifact: valistruct-desktop-macos-intel-autonomous
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          channels: conda-forge
          channel-priority: strict
      - name: Verify v5.1 desktop frontend assets
        shell: bash
        run: |
          if [ -f v52-shell.js ]; then
            test -f v52.css
            if [ -f efa-v52.js ]; then test -f efa-v52.css; fi
          fi
          if [ -f navigation-v51.js ]; then
            test -f participant-data.js
            grep -q 'skipping legacy desktop shell' desktop/main.js
          fi
      - name: Build integrated macOS runtime
        shell: bash -el {0}
        run: bash ./desktop/scripts/build_runtime_macos.sh
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Audit full npm dependency graph
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Build unpacked macOS app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack:mac
      - name: Ad-hoc sign macOS app for internal testing
        working-directory: desktop
        shell: bash
        run: |
          APP_PATH="$(find dist -maxdepth 2 -type d -name 'ValiStruct.app' | head -n 1)"
          test -n "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$PWD/$APP_PATH" >> "$GITHUB_ENV"
      - name: Smoke packaged macOS app
        working-directory: desktop
        shell: bash
        env:
          VALISTRUCT_SMOKE_TEST: "1"
        run: |
          BIN="$APP_PATH/Contents/MacOS/ValiStruct"
          test -x "$BIN"
          "$BIN" >/tmp/valistruct-packaged-macos.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$APP_PID" >/dev/null 2>&1 || true
          pkill -f 'backend/api.py' >/dev/null 2>&1 || true
          if [ "$ok" -ne 1 ]; then
            cat /tmp/valistruct-packaged-macos.log || true
            exit 1
          fi
      - name: Build macOS DMG from signed app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --prepackaged "$APP_PATH"
      - name: Upload macOS autonomous DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/*.dmg
          if-no-files-found: error
          compression-level: 0
