name: ValiStruct Mahalanobis-Mardia regression
on:
  push:
    branches: [hotfix/v5-2-mahalanobis-mardia]
  workflow_dispatch:
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Static code and JASP regression
        run: |
          node --check app.js
          node --test tests/test_jasp_import.cjs
          python tests/static_frontend_audit.py
      - name: Serve frontend
        run: |
          python -m http.server 8000 >/tmp/multi.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/multi.log
          exit 1
      - name: Verify Mahalanobis, Mardia and downloads
        env:
          VALISTRUCT_FRONTEND_URL: http://127.0.0.1:8000
        run: |
          pytest -q tests/test_multidiag_recovery.py
          pytest -q tests/test_hotfix_startup_privacy.py
          pytest -q tests/test_v52_ux.py
