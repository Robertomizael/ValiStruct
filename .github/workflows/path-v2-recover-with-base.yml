name: PATH v2 recovery with base objects

on:
  push:
    branches:
      - integration/path-v2-upload
    paths:
      - '.ci/path-v2-recover-with-base-trigger'

permissions:
  contents: read

jobs:
  recover-with-base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover partial bundle using full repository object database
        shell: bash
        run: |
          set -u
          BASE=6e78c3a62d2c493081c94114bea0e1fa0cb79590
          COMMIT=5d57520ac36b9a41e80b8932d84bbad38aec2a5d
          TREE=10c8600e71ef706c451b2459ed09d49e9d1ac7b4
          cat .ci/path-v2-bundle/part00 .ci/path-v2-bundle/part01 .ci/path-v2-bundle/part02 .ci/path-v2-bundle/part03 > /tmp/partial.b64
          base64 --decode /tmp/partial.b64 > /tmp/partial.bundle
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/partial.bundle').read_bytes(); i=b.find(b'PACK')
          assert i >= 0
          Path('/tmp/partial.pack').write_bytes(b[i:])
          print('partial_bundle_bytes=',len(b),'pack_offset=',i,'pack_bytes=',len(b)-i)
          PY

          echo '--- before recovery ---'
          git cat-file -e "$BASE^{tree}" && echo BASE_TREE_PRESENT
          git cat-file -e "$TREE" 2>/dev/null && echo TARGET_TREE_ALREADY_PRESENT || true

          echo '--- unpack into full object database ---'
          git unpack-objects -r < /tmp/partial.pack || true

          echo '--- expected commit/tree after recovery ---'
          git cat-file -e "$COMMIT" && echo COMMIT_RECOVERED || echo COMMIT_MISSING
          if git cat-file -e "$TREE" 2>/dev/null; then
            echo TREE_RECOVERED
            git cat-file -p "$TREE" | sed -n '1,240p'
            echo '--- diff audit base..target ---'
            git diff-tree --no-commit-id --name-status -r "$BASE" "$TREE" 2>/dev/null || true
          else
            echo TREE_MISSING
          fi

          echo '--- recovered/new unreachable objects ---'
          git fsck --full --no-reflogs --unreachable 2>&1 | sed -n '1,260p' || true

          echo '--- target object closure probe ---'
          if git cat-file -e "$TREE" 2>/dev/null; then
            missing=0
            while read -r mode type oid path; do
              if ! git cat-file -e "$oid" 2>/dev/null; then
                echo "MISSING_OBJECT $oid $path"
                missing=$((missing+1))
              fi
            done < <(git ls-tree -r "$TREE")
            echo "missing_objects=$missing"
          fi
