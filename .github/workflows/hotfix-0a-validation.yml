name: ValiStruct Hotfix 0-A - startup and privacy
on:
  push:
    branches:
      - hotfix/v5-1-desbloqueo-privacidad
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser-test dependencies
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Check JS syntax and JASP importer
        run: |
          node --check app.js
          node --test tests/test_jasp_import.cjs
      - name: Verify main navigation and DOM IDs
        run: python tests/static_frontend_audit.py
      - name: Start isolated frontend
        run: |
          python -m http.server 8000 > /tmp/valistruct-hotfix-http.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/valistruct-hotfix-http.log
          exit 1
      - name: Test full browser loading, reliability and privacy
        env:
          VALISTRUCT_FRONTEND_URL: http://127.0.0.1:8000
        run: pytest -q tests/test_hotfix_startup_privacy.py
