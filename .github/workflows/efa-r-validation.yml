name: ValiStruct AFE recovery - R and browser validation
on:
  push:
    branches: [fix/v5-2-afe-estadistica-exportaciones]
  workflow_dispatch:
jobs:
  validate-afe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::psych
            any::jsonlite
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser tooling
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: JavaScript syntax and protected JASP
        run: |
          node --check app.js
          node --check efa-v52.js
          node --test tests/test_jasp_import.cjs
          python tests/static_frontend_audit.py
      - name: Independent R factorial validation
        run: pytest -q tests/test_efa_engine_r.py
      - name: Serve frontend
        run: |
          python -m http.server 8000 >/tmp/efa-browser.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/efa-browser.log
          exit 1
      - name: Browser UX and downloads
        env: {VALISTRUCT_FRONTEND_URL: 'http://127.0.0.1:8000'}
        run: |
          pytest -q tests/test_hotfix_startup_privacy.py
          pytest -q tests/test_v52_ux.py
          pytest -q tests/test_efa_v52_browser.py
