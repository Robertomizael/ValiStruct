name: ValiStruct v5.4 hardening gates

on:
  push:
    branches:
      - "feature/v5-4-fase3-hardening"
      - "feature/v5-4-integration-safe-20261014"
      - "feature/v5-4-etapa4-estabilidad"
      - "feature/v5-4-etapa4-criterio"
      - "feature/v5-4-etapa4-estabilidad-ux-template"
      - "feature/v5-4-etapa4-rendimiento-baremacion"
      - "feature/v5-4-visual-polish-v11-v12"
  workflow_dispatch:

concurrency:
  group: v54-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest openpyxl

      - name: JavaScript syntax
        run: |
          node --check stability-v54.js
          node --check stability-template-v54.js
          node --check criterion-v54.js
          node --check performance-v54.js
          node --check desktop/v54-desktop-session-auth.js
          node --check desktop/v54-macos-window-lifecycle.js
          node --check desktop/v54-release-coherence.js
          node --check desktop/v54-analysis-workflow.js
          node --check desktop/v54-diagnostics-interpretation.js
          node --check desktop/v54-cfa-professional-path.js
          node --check desktop/v54-results-hub.js
          node --check desktop/v54-content-validity-runtime-fix.js
          node --check desktop/v54-results-preview-fix.js
          node --check desktop/v54-latencia-editing.js
          node --check desktop/v54-context-menu.js
          node --check desktop/v54-visual-polish.js
          node --check desktop/content-validity-xlsx-renderer.js
          node --check desktop/content-validity-xlsx-hardening.js
          node --check desktop/main-patched.js
          node --check desktop/main.js
          node --check desktop/backend-lifecycle.js

      - name: Run behavioral hotfix checks
        run: |
          node --test tests/test_v54_behavioral_hotfixes.cjs
          node --test tests/test_v54_stability.cjs
          node --test tests/test_v54_criterion.cjs
          node --test tests/test_v54_performance.cjs
          node --test tests/test_v54_backend_lifecycle.cjs

      - name: Run v5.4 hardening contracts
        run: |
          pytest -q tests/test_v54_*.py
          pytest -q tests/test_content_validity_xlsx_contract.py
          pytest -q tests/test_content_validity_xlsx_runtime_processing.py
