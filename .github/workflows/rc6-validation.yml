name: ValiStruct RC Validation

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "app.js"
      - "index.html"
      - "service-worker.js"
      - "deployment/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Cache R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lavaan
            any::jsonlite
            any::psych
            any::naniar
          extra-packages: any::remotes

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Static release checks
        run: python tests/release_check.py

      - name: Backend tests
        working-directory: backend
        run: pytest -q tests

      - name: Statistical equivalence vs direct lavaan
        run: python tests/run_statistical_validation.py

      - name: Start backend
        working-directory: backend
        env:
          VALISTRUCT_AUTH_ENABLED: "false"
          VALISTRUCT_PROJECT_LIBRARY_ENABLED: "false"
          VALISTRUCT_ENV: "development"
        run: |
          gunicorn --workers 2 --threads 4 --timeout 360 --bind 127.0.0.1:8765 api:app > /tmp/valistruct.log 2>&1 &
          echo $! > /tmp/valistruct.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/valistruct.log
          exit 1

      - name: Backend smoke
        run: |
          VALISTRUCT_BASE_URL=http://127.0.0.1:8765 deployment/docker_smoke_test.sh

      - name: Set up browser
        run: |
          playwright install --with-deps chromium

      - name: Start frontend
        run: |
          python -m http.server 8000 > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid

      - name: Browser E2E
        env:
          VALISTRUCT_FRONTEND_URL: http://127.0.0.1:8000
        run: pytest -q tests/test_e2e_playwright.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valistruct-validation-artifacts
          path: |
            tests/*VERIFICATION*.json
            tests/RC6_VALIDATION_REPORT.json
            /tmp/valistruct.log
