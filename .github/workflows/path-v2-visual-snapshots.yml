name: PATH v2 visual snapshots

on:
  push:
    branches:
      - integration/path-v2-upload
    paths:
      - '.ci/path-v2-visual-snapshots-trigger'

permissions:
  contents: read

jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover exact renderer and fixtures
        shell: bash
        run: |
          set -euo pipefail
          TREE=10c8600e71ef706c451b2459ed09d49e9d1ac7b4
          cat .ci/path-v2-bundle/part00 .ci/path-v2-bundle/part01 .ci/path-v2-bundle/part02 .ci/path-v2-bundle/part03 >/tmp/partial.b64
          base64 --decode /tmp/partial.b64 >/tmp/partial.bundle
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/partial.bundle').read_bytes(); i=b.find(b'PACK'); assert i>=0
          Path('/tmp/partial.pack').write_bytes(b[i:])
          PY
          git unpack-objects -r </tmp/partial.pack || true
          git show "$TREE:path-v2.js" >/tmp/path-v2.js
          git show "$TREE:tests/fixtures/path_v2/f2.json" >/tmp/f2.json
          git show "$TREE:tests/fixtures/path_v2/f6_40.json" >/tmp/f6_40.json
          test "$(sha256sum /tmp/path-v2.js | awk '{print $1}')" = "f0a0c36ee8eec452876d8dda188ca8a42e966976f00548e46231e6f051f1e815"

      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture exact PATH v2 visual modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/path-v2-snapshots
          cat >/tmp/path-snapshots.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:24px;background:#f4f6f8;font-family:Arial,sans-serif}#host{background:white;border-radius:12px;padding:14px;min-height:860px}</style></head><body><div id="host"></div><script src="/path-v2.js"></script></body></html>
          HTML
          cat >/tmp/path-snapshots.cjs <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:1100},deviceScaleFactor:1});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:8125/path-snapshots.html');
            const f2=JSON.parse(fs.readFileSync('/tmp/f2.json','utf8'));
            const f6=JSON.parse(fs.readFileSync('/tmp/f6_40.json','utf8'));
            async function mount(raw,design,file){
              await page.evaluate(({raw,design})=>{
                const p=window.ValiStructPathV2;
                const host=document.getElementById('host');
                host.innerHTML='';
                p.mount(host,p.fromLavaan(raw),{design});
              },{raw,design});
              await page.waitForTimeout(150);
              const wrapper=page.locator('div.vs-path-v2[data-path-renderer="v2"]').first();
              if(await wrapper.count()!==1) throw new Error('PATH wrapper missing '+file);
              await wrapper.screenshot({path:'/tmp/path-v2-snapshots/'+file});
              console.log('snapshot_ok '+file+' dir='+await wrapper.getAttribute('data-path-dir')+' design='+await wrapper.getAttribute('data-path-design'));
            }
            await mount(f2,'amosH','01_amos_horizontal_2f.png');
            await mount(f2,'amosV','02_amos_vertical_2f.png');
            await mount(f2,'jaspV','03_jasp_vertical_2f.png');
            await mount(f2,'publication','04_publication_2f.png');
            await mount(f6,'amosH','05_amos_horizontal_6f40.png');
            await mount(f6,'amosV','06_amos_vertical_6f40.png');
            if(errors.length) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cd /tmp && python3 -m http.server 8125 >/tmp/path-shot-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 1
          cd "$GITHUB_WORKSPACE"
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/path-snapshots.cjs
          ls -lh /tmp/path-v2-snapshots

      - name: Upload PATH v2 visual snapshots
        uses: actions/upload-artifact@v4
        with:
          name: path-v2-visual-snapshots
          path: /tmp/path-v2-snapshots/*.png
          if-no-files-found: error
          retention-days: 14
