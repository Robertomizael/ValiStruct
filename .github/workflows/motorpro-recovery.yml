name: ValiStruct Motor Pro recovery
on:
  push:
    branches: [hotfix/v5-2-motorpro-recovery, hotfix/v5-2-4-motorpro-numerics-contextmenu]
  workflow_dispatch:
jobs:
  motorpro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {use-public-rspm: true}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lavaan
            any::jsonlite
            any::psych
            any::naniar
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install Python and browser tooling
        run: |
          python -m pip install pytest playwright Flask flask-cors gunicorn
          python -m playwright install --with-deps chromium
      - name: Static and protected regressions
        run: |
          node --check app.js
          node --test tests/test_jasp_import.cjs
          node --test tests/test_desktop_context_menu.cjs
          python tests/static_frontend_audit.py
      - name: Numerically verify real lavaan (5 factors / 28 indicators and undefined indices)
        run: pytest -q tests/test_motorpro_numerical_regression.py
      - name: Start backend
        env:
          VALISTRUCT_AUTH_ENABLED: "false"
          VALISTRUCT_ENV: "development"
        run: |
          python -m flask --app backend.api run --host 127.0.0.1 --port 8765 >/tmp/motorpro-backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/motorpro-backend.log
          exit 1
      - name: Start frontend
        run: |
          python -m http.server 8000 >/tmp/motorpro-front.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/motorpro-front.log
          exit 1
      - name: Verify real Motor Pro workflow
        env:
          VALISTRUCT_FRONTEND_URL: http://127.0.0.1:8000
        run: pytest -q tests/test_motorpro_recovery.py
