name: ValiStruct v5.4 finalize validated lockfile repair

on:
  push:
    branches:
      - feature/v5-4-integration-safe-20261014

permissions:
  contents: write

jobs:
  finalize-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/v5-4-integration-safe-20261014
          fetch-depth: 0

      - name: Use Node 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Regenerate validated desktop lockfile
        working-directory: desktop
        run: |
          rm -rf node_modules
          npm install --package-lock-only --ignore-scripts

      - name: Prove npm ci reproducibility
        working-directory: desktop
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts

      - name: Verify hardened top-level dependencies
        working-directory: desktop
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const root = lock.packages && lock.packages[''];
          if (!root) throw new Error('package-lock root package missing');
          for (const section of ['dependencies','devDependencies']) {
            const a = pkg[section] || {};
            const b = root[section] || {};
            if (JSON.stringify(a) !== JSON.stringify(b)) {
              console.error(section, {packageJson:a, lockfile:b});
              process.exit(1);
            }
          }
          console.log('package.json and package-lock.json top-level dependencies are synchronized');
          NODE

      - name: Commit repaired lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/package-lock.json
          git rm .github/workflows/v54-lockfile-repair.yml
          git commit -m "build(v5.4): commit validated reproducible desktop lockfile"
          git push origin HEAD:feature/v5-4-integration-safe-20261014
