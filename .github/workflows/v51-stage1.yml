name: ValiStruct v5.1 stage-1 - navigation and data manager
on:
  push:
    branches: [feature/v5-1-fase1-diseno-datamanager]
  workflow_dispatch:
jobs:
  stage1-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools and Chromium
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Validate all new scripts and existing importer
        run: |
          node --check app.js
          node --check navigation-v51.js
          node --check participant-data.js
          node --test tests/test_jasp_import.cjs
          python tests/static_frontend_audit.py
      - name: Start frontend
        run: |
          python -m http.server 8000 > /tmp/v51-stage1-frontend.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v51-stage1-frontend.log
          exit 1
      - name: Browser startup, privacy and stage-1 integration
        env:
          VALISTRUCT_FRONTEND_URL: http://127.0.0.1:8000
        run: |
          pytest -q tests/test_hotfix_startup_privacy.py
          pytest -q tests/test_v51_stage1.py
