name: PATH v2 JASP to lavaan end-to-end gate

on:
  push:
    branches:
      - integration/path-v2-upload
    paths:
      - '.ci/path-v2-jasp-e2e-trigger'

permissions:
  contents: read

jobs:
  jasp-lavaan-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::lavaan
            any::jsonlite

      - name: Recover exact PATH v2 and base JASP importer
        shell: bash
        run: |
          set -euo pipefail
          BASE=6e78c3a62d2c493081c94114bea0e1fa0cb79590
          TREE=10c8600e71ef706c451b2459ed09d49e9d1ac7b4
          cat .ci/path-v2-bundle/part00 .ci/path-v2-bundle/part01 .ci/path-v2-bundle/part02 .ci/path-v2-bundle/part03 > /tmp/partial.b64
          base64 --decode /tmp/partial.b64 > /tmp/partial.bundle
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/partial.bundle').read_bytes(); i=b.find(b'PACK'); assert i>=0
          Path('/tmp/partial.pack').write_bytes(b[i:])
          PY
          git unpack-objects -r < /tmp/partial.pack || true
          git show "$TREE:path-v2.js" > /tmp/path-v2.js
          git show "$BASE:jasp-import.js" > /tmp/jasp-import.js
          test "$(sha256sum /tmp/path-v2.js | awk '{print $1}')" = "f0a0c36ee8eec452876d8dda188ca8a42e966976f00548e46231e6f051f1e815"

      - name: Parse JASP-style syntax safely
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('/tmp/jasp-import.js','utf8');
          const sandbox={window:{},document:{getElementById(){return null;}},console};
          vm.runInNewContext(source,sandbox,{filename:'jasp-import.js'});
          const parse=sandbox.window.ValiStructJaspImporter.parse;
          const input=`library(lavaan)
          model <- 'F1 =~ x1 + x2 + x3 + x4
          F2 =~ x5 + x6 + x7 + x8
          F1 ~~ F2'
          fit <- cfa(model, data = d, estimator = 'MLR')`;
          const parsed=parse(input);
          if(parsed.estimator!=='MLR') throw new Error('JASP estimator lost');
          if(parsed.factors.length!==2 || parsed.required.length!==8) throw new Error('JASP model structure lost');
          fs.writeFileSync('/tmp/parsed-jasp.json',JSON.stringify(parsed));
          console.log('JASP_PARSE_OK estimator='+parsed.estimator+' factors='+parsed.factors.length+' indicators='+parsed.required.length);
          console.log('lavaan_model='+parsed.model.replace(/\n/g,' | '));
          NODE

      - name: Generate data and Motor Pro request from parsed JASP model
        shell: bash
        run: |
          python3 - <<'PY'
          import json,csv,random,math
          from io import StringIO
          parsed=json.load(open('/tmp/parsed-jasp.json'))
          rng=random.Random(20261006); rows=[]
          for _ in range(450):
              f1=rng.gauss(0,1); f2=.4*f1+math.sqrt(1-.4**2)*rng.gauss(0,1)
              row=[]
              for lam in (.84,.78,.72,.66): row.append(lam*f1+math.sqrt(1-lam**2)*rng.gauss(0,1))
              for lam in (.81,.75,.70,.65): row.append(lam*f2+math.sqrt(1-lam**2)*rng.gauss(0,1))
              rows.append(row)
          s=StringIO(); w=csv.writer(s); w.writerow([f'x{i}' for i in range(1,9)]); w.writerows(rows)
          req={'csv_text':s.getvalue(),'syntax':parsed['model'],'estimator':parsed['estimator'],'data_type':'continuous','missing':'listwise','bootstrap':0}
          open('/tmp/jasp-request.json','w').write(json.dumps(req))
          PY

      - name: Execute real lavaan engine
        shell: bash
        run: |
          set -euo pipefail
          Rscript backend/lavaan_engine.R /tmp/jasp-request.json /tmp/jasp-response.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/jasp-response.json'))
          assert r.get('ok') is True, r
          assert r.get('converged') is True, r
          assert r.get('estimator')=='MLR', r.get('estimator')
          assert len([x for x in r.get('parameters',[]) if x.get('op')=='=~'])==8
          print('JASP_TO_LAVAAN_OK estimator=',r['estimator'],'n=',r['n'])
          PY

      - name: Feed real JASP-derived lavaan result to exact PATH v2
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const p=require('/tmp/path-v2.js');
          const r=JSON.parse(fs.readFileSync('/tmp/jasp-response.json','utf8'));
          const raw=JSON.stringify(r);
          const stats=JSON.stringify({fit:r.fit,fit_robust:r.fit_robust,parameters:r.parameters});
          const before=crypto.createHash('sha256').update(stats).digest('hex');
          const m=p.fromLavaan(r);
          if(m.factors.length!==2||m.indicators.length!==8||m.loadings.length!==8) throw new Error('PATH lost JASP-derived parameters');
          for(const orientation of ['LR','TB','RL','BT']){
            const o=p.normalizeOptions(m,{orientation});
            const scene=p.render(m,o);
            if(!scene?.ops?.length) throw new Error('PATH render failed '+orientation);
          }
          const afterStats=JSON.stringify({fit:r.fit,fit_robust:r.fit_robust,parameters:r.parameters});
          const after=crypto.createHash('sha256').update(afterStats).digest('hex');
          if(before!==after || raw!==JSON.stringify(r)) throw new Error('JASP/lavaan result mutated by PATH v2');
          console.log('jasp_stats_sha_before='+before);
          console.log('jasp_stats_sha_after ='+after);
          console.log('JASP_LAVAAN_PATH_E2E_OK');
          NODE
