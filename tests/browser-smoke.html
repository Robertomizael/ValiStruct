<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>ValiStruct 2.2 · Pruebas</title>
<body>
<h1>ValiStruct 2.2 · Smoke Test</h1>
<pre id="out"></pre>
<script>
const checks = [];
function add(name,ok){checks.push({name,ok});}
add("Web Crypto",!!window.crypto?.subtle);
add("File API",!!window.FileReader);
add("Blob",!!window.Blob);
add("LocalStorage",(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}catch(e){return false}})());
add("Pointer Events","PointerEvent" in window);
document.getElementById("out").textContent=checks.map(x=>`${x.ok?"PASS":"WARN"} - ${x.name}`).join("\n");
</script>
</body></html>
